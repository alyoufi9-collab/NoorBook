<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NoorBook</title>
<style>
*{box-sizing:border-box}
body{font-family:Arial;background:#f0f2f5;margin:0}
.header{background:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 1px 5px #ddd;position:sticky;top:0}
.logo{font-size:24px;font-weight:900;color:#1877f2}
.container{max-width:600px;margin:16px auto;padding:0 12px}
.card{background:#fff;border-radius:12px;padding:16px;margin-bottom:12px;box-shadow:0 1px 3px #ddd}
input,textarea{width:100%;padding:12px;border:1px solid #ddd;border-radius:8px;margin:6px 0;font-size:15px}
button{background:#1877f2;color:#fff;border:none;padding:11px;border-radius:8px;font-weight:bold;cursor:pointer;width:100%;margin-top:6px}
button.green{background:#42b72a}
button.gray{background:#e4e6eb;color:#000}
.avatar{width:40px;height:40px;border-radius:50%;background:#1877f2;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:bold}
.flex{display:flex;gap:10px;align-items:center}
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tabs button{width:auto;flex:1}
.tabs button.active{background:#1877f2}
.chat-user{padding:10px;border-bottom:1px solid #eee;cursor:pointer}
.msg{padding:8px 12px;border-radius:12px;margin:6px 0;max-width:80%}
.me{background:#1877f2;color:#fff;margin-left:auto}
.other{background:#e4e6eb}
</style>
</head>
<body>
<div class="header"><div class="logo">NoorBook</div><div id="headerUser"></div></div>
<div class="container">
<div id="authBox" class="card">
<h2 id="authTitle">تسجيل الدخول</h2>
<input id="username" placeholder="اسم المستخدم - للتسجيل فقط" style="display:none">
<input id="email" placeholder="البريد الالكتروني">
<input id="password" type="password" placeholder="كلمة السر">
<button onclick="doAuth()" id="authBtn">دخول</button>
<button class="green" onclick="toggleAuth()">انشاء حساب جديد</button>
<p id="authMsg" style="color:red"></p>
</div>

<div id="mainBox" style="display:none">
<div class="tabs">
<button class="active" onclick="showTab('posts',this)">المنشورات</button>
<button onclick="showTab('chat',this)">NoorChat</button>
<button onclick="showTab('notif',this)">الاشعارات</button>
</div>

<div id="tab-posts">
<div class="card">
<textarea id="postContent" placeholder="شنو في بالك؟"></textarea>
<input id="postImage" placeholder="رابط صورة - اختياري">
<button onclick="createPost()">نشر</button>
</div>
<div id="postsList"></div>
</div>

<div id="tab-chat" style="display:none">
<div class="card"><h3>المستخدمين</h3><div id="usersList"></div></div>
<div class="card">
<h3 id="chatTitle">اختر مستخدم للشات</h3>
<div id="chatBox" style="max-height:300px;overflow:auto"></div>
<input id="chatInput" placeholder="اكتب رسالة...">
<button onclick="sendMsg()">ارسال</button>
</div>
</div>

<div id="tab-notif" style="display:none">
<div class="card"><div id="notifList"></div></div>
</div>

<button onclick="logout()" style="background:#888">تسجيل خروج</button>
</div>
</div>

<script>
let user = JSON.parse(localStorage.getItem('noor_user') || 'null');
let isRegister = false;
let chatWith = null;

function toggleAuth(){
  isRegister = !isRegister;
  document.getElementById('authTitle').innerText = isRegister ? 'انشاء حساب' : 'تسجيل الدخول';
  document.getElementById('authBtn').innerText = isRegister ? 'تسجيل' : 'دخول';
  document.getElementById('username').style.display = isRegister ? 'block' : 'none';
}
if(user){ showMain(); }

function showMain(){
  document.getElementById('authBox').style.display = 'none';
  document.getElementById('mainBox').style.display = 'block';
  document.getElementById('headerUser').innerText = 'اهلا ' + user.username;
  loadPosts(); loadUsers(); loadNotif();
}
async function doAuth(){
  let u = document.getElementById('username').value;
  let e = document.getElementById('email').value;
  let p = document.getElementById('password').value;
  let url = isRegister ? '/api/register' : '/api/login';
  let body = isRegister ? {username:u,email:e,password:p} : {email:e,password:p};
  let r = await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  let d = await r.json();
  if(d.user){ localStorage.setItem('noor_user', JSON.stringify(d.user)); user = d.user; showMain(); }
  else { document.getElementById('authMsg').innerText = d.error || 'خطأ'; }
}
function logout(){ localStorage.removeItem('noor_user'); location.reload(); }
function showTab(t,btn){
  document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  ['posts','chat','notif'].forEach(x=>{ document.getElementById('tab-'+x).style.display = x==t ? 'block' : 'none'; });
}
async function loadPosts(){
  let r = await fetch('/api/posts');
  let d = await r.json();
  let html = '';
  for(let p of d.posts){
    let img = p.image ? '<img src="'+p.image+'" style="width:100%;border-radius:10px">' : '';
    let del = p.user_id==user.id ? '<button onclick="delPost('+p.id+')" style="background:#ff4444">حذف</button>' : '';
    html += '<div class="card"><div class="flex"><div class="avatar">'+p.username.charAt(0)+'</div><b>'+p.username+'</b></div><p>'+p.content+'</p>'+img+del+'</div>';
  }
  document.getElementById('postsList').innerHTML = html || 'لا توجد منشورات';
}
async function createPost(){
  let c = document.getElementById('postContent').value;
  if(!c) return;
  await fetch('/api/posts',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user_id:user.id,content:c,image:document.getElementById('postImage').value})});
  document.getElementById('postContent').value = '';
  loadPosts();
}
async function delPost(id){ await fetch('/api/posts/'+id,{method:'DELETE'}); loadPosts(); }
async function loadUsers(){
  let r = await fetch('/api/users');
  let d = await r.json();
  let html = '';
  for(let x of d.users){
    if(x.id != user.id){ html += '<div class="chat-user" onclick="openChat('+x.id+',\''+x.username+'\')">👤 '+x.username+'</div>'; }
  }
  document.getElementById('usersList').innerHTML = html || 'لا يوجد مستخدمين';
}
async function openChat(id,name){
  chatWith = id;
  document.getElementById('chatTitle').innerText = 'محادثة مع ' + name;
  let r = await fetch('/api/messages?user_id='+user.id+'&other_id='+id);
  let d = await r.json();
  let html = '';
  for(let m of d.messages){
    let cls = m.sender_id==user.id ? 'me' : 'other';
    html += '<div class="msg '+cls+'">'+m.content+'</div>';
  }
  document.getElementById('chatBox').innerHTML = html;
}
async function sendMsg(){
  let c = document.getElementById('chatInput').value;
  if(!c || !chatWith) return alert('اختر مستخدم اولا');
  await fetch('/api/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({sender_id:user.id,receiver_id:chatWith,content:c})});
  document.getElementById('chatInput').value = '';
  let name = document.getElementById('chatTitle').innerText.replace('محادثة مع ','');
  openChat(chatWith, name);
  loadNotif();
}
async function loadNotif(){
  let r = await fetch('/api/notifications/'+user.id);
  let d = await r.json();
  let html = '';
  for(let n of d.notifications){ html += '<div style="padding:10px;border-bottom:1px solid #eee">'+n.content+'</div>'; }
  document.getElementById('notifList').innerHTML = html || 'لا توجد اشعارات';
}
</script>
</body>
</html>
